# Render Blueprint: backend + Postgres. Frontend goes on Vercel (see README).
databases:
  - name: shipments-db
    plan: free
services:
  - type: web
    name: shipment-tracker-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shipments-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false   # set to your Vercel URL, e.g. https://shipment-tracker.vercel.app
